# Pipeline minimal (phase 1) : il vérifie seulement que la chaîne Filebeat -> Logstash -> ES fonctionne.
# Le parsing et l'enrichissement des logs Nginx arrivent en phase 3.

input {
  beats {
    port => 5044
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nginx-%{+YYYY.MM.dd}"
  }
}
