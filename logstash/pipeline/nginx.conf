# =============================================================================
# Pipeline Logstash : logs d'accès Nginx -> Elasticsearch
# Trois étapes : input (réception) -> filter (transformation) -> output (envoi)
# =============================================================================

# -----------------------------------------------------------------------------
# INPUT : réception des événements envoyés par Filebeat
# -----------------------------------------------------------------------------
input {
  beats {
    # Port d'écoute du protocole Beats (Filebeat s'y connecte via le réseau Docker)
    port => 5044
  }
}

# -----------------------------------------------------------------------------
# FILTER : transformation de chaque ligne de log en document structuré
# -----------------------------------------------------------------------------
filter {

  # --- 1. Parsing : JSON (format de nos Nginx) ou texte (format "combined") ---

  # Une ligne qui commence par "{" est du JSON (log_format json_logs)
  if [message] =~ /^\s*\{/ {
    json {
      # Le texte brut de la ligne se trouve dans le champ "message"
      source => "message"
      # Les clés JSON deviennent des champs à la racine du document
      # (en cas d'échec, Logstash ajoute le tag _jsonparsefailure)
    }
  } else {
    # Sinon, format texte classique de Nginx/Apache ("combined"), éventuellement
    # suivi du temps de réponse ($request_time) en fin de ligne
    grok {
      match => {
        "message" => '%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:time}\] "%{WORD:method} %{DATA:uri} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:bytes_sent} "%{DATA:referrer}" "%{DATA:user_agent}"(?: %{NUMBER:request_time})?'
      }
      # (en cas d'échec, Logstash ajoute le tag _grokparsefailure)
    }
  }

  # --- 2. Date : l'heure de la requête devient l'horodatage officiel ---

  date {
    # ISO8601 pour le JSON ("2026-10-26T10:00:00+01:00"), HTTPDATE pour le texte
    match => ["time", "ISO8601", "dd/MMM/yyyy:HH:mm:ss Z"]
    # @timestamp est le champ utilisé par Kibana pour l'axe du temps
    target => "@timestamp"
    # Le champ "time" est supprimé uniquement si la date a été comprise
    remove_field => ["time"]
  }

  # --- 3. Types : conversion des chaînes en nombres pour calculer (moyennes, etc.) ---

  mutate {
    convert => {
      # Code HTTP : nombre entier (ex. 401), filtrable par intervalle
      "status"       => "integer"
      # Taille de la réponse en octets
      "bytes_sent"   => "integer"
      # Temps de réponse en secondes (ex. 0.042)
      "request_time" => "float"
    }
  }

  # Nginx écrit "" quand la requête n'est pas passée par un upstream : on retire ces champs vides
  if [upstream_addr] == ""          { mutate { remove_field => ["upstream_addr"] } }
  if [upstream_status] == ""        { mutate { remove_field => ["upstream_status"] } }
  if [upstream_response_time] == "" { mutate { remove_field => ["upstream_response_time"] } }

  # --- 4. Enrichissement : nouveaux champs calculés ---

  # Temps de réponse en millisecondes (plus lisible dans un dashboard)
  if [request_time] {
    ruby {
      code => "event.set('response_time_ms', (event.get('request_time').to_f * 1000).round)"
    }
  }

  # Famille du code HTTP : 2xx succès, 3xx redirection, 4xx erreur client, 5xx erreur serveur
  if [status] {
    if [status] >= 500      { mutate { add_field => { "status_family" => "5xx" } } }
    else if [status] >= 400 { mutate { add_field => { "status_family" => "4xx" } } }
    else if [status] >= 300 { mutate { add_field => { "status_family" => "3xx" } } }
    else if [status] >= 200 { mutate { add_field => { "status_family" => "2xx" } } }
    else                    { mutate { add_field => { "status_family" => "1xx" } } }
  }

  # Tentative de connexion échouée : POST sur /login refusé (401 ou 403)
  # C'est ce tag qui permet de repérer une attaque par force brute
  if [method] == "POST" and [uri] =~ /^\/login/ and [status] in [401, 403] {
    mutate { add_tag => ["failed_login"] }
  }

  # Origine du log, déduite du nom du fichier lu par Filebeat
  if [log][file][path] =~ /microservices\.log$/ {
    mutate { add_field => { "log_origin" => "microservices-ha-cluster" } }
  } else {
    mutate { add_field => { "log_origin" => "generator" } }
  }

  # Analyse du user-agent : navigateur, système, type d'appareil
  if [user_agent] {
    useragent {
      source => "user_agent"
      # Résultat dans "ua" (ua.name, ua.os.name, ua.device.name...) pour ne pas écraser la chaîne d'origine
      target => "ua"
    }
  }

  # --- 5. Nettoyage : on retire ce qui n'apporte rien à l'analyse ---

  # Métadonnées ajoutées par Filebeat (nom du conteneur, version, position dans le fichier...)
  mutate {
    remove_field => ["agent", "ecs", "host", "input", "event", "[log][offset]", "[log][file][inode]", "[log][file][device_id]"]
    # Tag technique ajouté par l'input beats, sans intérêt pour l'analyse
    remove_tag   => ["beats_input_codec_plain_applied"]
  }

  # La ligne brute n'est conservée que si le parsing a échoué (utile pour déboguer)
  if "_jsonparsefailure" not in [tags] and "_grokparsefailure" not in [tags] {
    mutate { remove_field => ["message"] }
  }
}

# -----------------------------------------------------------------------------
# OUTPUT : envoi vers Elasticsearch
# -----------------------------------------------------------------------------
output {
  elasticsearch {
    # Adresse d'Elasticsearch sur le réseau Docker (HTTP simple : sécurité désactivée en lab)
    hosts => ["http://elasticsearch:9200"]
    # Un index par jour (date UTC de @timestamp) : nginx-2026.10.26, nginx-2026.10.27...
    index => "nginx-%{+YYYY.MM.dd}"
    # Logstash installe notre index template (types des champs) au démarrage
    manage_template    => true
    template           => "/usr/share/logstash/templates/nginx-template.json"
    template_name      => "nginx"
    # Le template du dépôt remplace toujours celui déjà présent dans Elasticsearch
    template_overwrite => true
  }
}
